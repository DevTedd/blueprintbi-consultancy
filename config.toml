baseURL = "https://www.blueprintbi.co.ke/"
themesDir = "themes"
theme = "serif"
languageCode = "en-us"
title = "Blueprint BI | Data & Business Intelligence for Kenyan SMEs"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"

[params]
  google_analytics_id = ""
  google_tag_manager_id = ""
  favicon = "favicon-32x32.png"
  contact_form_action = "https://formspree.io/f/mqeyzarv"
  email = "hello@blueprintbi.co.ke"
  phone = "+254 757 334 164"
  

  [params.homepage]
    sticky_header = true
    show_contact_box = true      
    show_services_button = true 

  [params.logo]
    mobile = "images/logo/logo-mobile.svg"
    mobile_height = "48px"
    desktop = "images/logo/logo.svg"
    desktop_height = "84px"
    alt = "Blueprint BI - Business Intelligence Consultancy for Kenyan SMEs"

  [params.fonts]
    # sets the google font link in layouts/partials/google-fonts.html
    google_fonts = 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Source+Sans+Pro:wght@400;700&display=swap'
    heading = "Playfair Display"
    base = "Source Sans Pro"

  [params.colors]
    primary = "#2D6A4F"
    black = "#1B4332"
    white = "#ffffff"
    white_offset = "#F7FFF7"
    grey = "#5C5A5A"

  [params.seo]
    meta_twitter_site = ""
    meta_twitter_creator = ""
    meta_og_image = "https://www.blueprintbi.co.ke/images/og-image.jpg"
    business_locality = "Nairobi"
    business_country = "Kenya"

  [params.services]
    summary_truncate = 80 # How many characters to include in the summary of the services before truncating

  [params.team]
    summary_large_truncate = 80 # How many characters to include in the summary of the team bios (large layout) before truncating

  [params.footer]
    copyright_text = '© 2026 Blueprint BI Consultancy - Turning Data into Strategy.'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  # Main Menu
  [[menu.main]]
    name = "Services"
    url = "/services/"
    weight = 1

  [[menu.main]]
    name = "Work"
    url = "/work/"
    weight = 2

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 5

 [[menu.main]]
    name = "Insights"
    url = "/blog/"
    weight = 3  

    

  # Footer Menu
  [[menu.footer]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.footer]]
    name = "Work"
    url = "/work/"
    weight = 2

  [[menu.footer]]
    name = "Services"
    url = "/services/"
    weight = 2

